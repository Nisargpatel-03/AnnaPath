{% extends "layout.html" %}

{% block content %}

<div class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-lg-5 col-md-7 col-sm-10">

            <div class="card p-4 p-md-5 shadow-lg border-0" style="border-radius: var(--radius-2xl);">

                <div class="text-center mb-4">
                    <img src="{{ url_for('static', filename='images/logo.png') }}" alt="AnnaPath" height="72" class="mb-3 d-inline-block" style="max-width: 210px; object-fit: contain;">
                    <h2 class="fw-bolder text-dark mt-1" style="letter-spacing: -0.025em;">Sign In to AnnaPath</h2>
                    <p class="text-muted small mb-0">Select your active role and credentials to access your dashboard</p>
                </div>

                <form action="/login" method="POST">

                    <!-- Role Selection -->
                    <div class="mb-3">
                        <label class="form-label d-flex justify-content-between align-items-center">
                            <span>Select Account Role</span>
                            <span class="text-muted small" style="font-size: 0.75rem;">Required</span>
                        </label>
                        <select class="form-select form-select-lg" name="role" required>
                            <option value="Donor" {% if selected_role == 'Donor' %}selected{% endif %}>
                                Food Donor
                            </option>
                            <option value="Receiver" {% if selected_role == 'Receiver' %}selected{% endif %}>
                                Food Receiver
                            </option>
                            <option value="Volunteer" {% if selected_role == 'Volunteer' %}selected{% endif %}>
                                Volunteer Partner
                            </option>
                            <option value="Admin" {% if selected_role == 'Admin' %}selected{% endif %}>
                                Platform Admin
                            </option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0 text-muted">
                                <i class="bi bi-envelope"></i>
                            </span>
                            <input type="email" class="form-control form-control-lg border-start-0 ps-0" name="email"
                                   placeholder="name@example.com"
                                   value="{{ email or '' }}" required autofocus>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0 text-muted">
                                <i class="bi bi-key"></i>
                            </span>
                            <input type="password" class="form-control form-control-lg border-start-0 ps-0" name="password"
                                   placeholder="Enter your account password" required>
                        </div>
                    </div>

                    <div class="d-grid mt-4">
                        <button class="btn btn-success btn-lg fw-bold" type="submit">
                            <span>Sign In to Dashboard</span>
                            <i class="bi bi-arrow-right"></i>
                        </button>
                    </div>

                </form>

                {% if selected_role != 'Admin' %}
                <div class="position-relative text-center my-4">
                    <hr class="text-muted opacity-25">
                    <span class="position-absolute top-50 start-50 translate-middle bg-white px-3 text-muted small" style="font-size: 0.8rem;">
                        NEW TO ANNAPATH?
                    </span>
                </div>

                <p class="text-center text-muted mb-0 small">
                    Don't have an account registered yet?
                    <a href="/register{% if selected_role %}?role={{ selected_role }}{% endif %}" class="fw-bold text-success text-decoration-none ms-1">
                        Register Account &rarr;
                    </a>
                </p>
                {% endif %}

            </div>

        </div>
    </div>
</div>

{% endblock %}
