{% extends "layout.html" %}

{% block content %}

<div class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8">

            <div class="card p-4 p-md-5 shadow-lg border-0" style="border-radius: var(--radius-2xl);">

                <div class="text-center mb-4">
                    <img src="{{ url_for('static', filename='images/logo.png') }}" alt="AnnaPath" height="72" class="mb-3 d-inline-block" style="max-width: 210px; object-fit: contain;">
                    <h2 class="fw-bolder text-dark mt-1" style="letter-spacing: -0.025em;">Join the AnnaPath Network</h2>
                    <p class="text-muted small mb-0">Create an account to start donating, requesting, or volunteering</p>
                </div>

                <form action="/register" method="POST" id="registerForm">

                    <!-- Role Selection -->
                    <div class="mb-3">
                        <label class="form-label d-flex justify-content-between align-items-center">
                            <span>Select Your Role</span>
                            <span class="text-muted small" style="font-size: 0.75rem;">Defines permissions</span>
                        </label>
                        <select class="form-select form-select-lg" name="role" required>
                            <option value="Donor" {% if selected_role == 'Donor' %}selected{% endif %}>
                                Food Donor (Restaurants, Households, Caterers)
                            </option>
                            <option value="Receiver" {% if selected_role == 'Receiver' %}selected{% endif %}>
                                Food Receiver (Individuals, Families, Shelters)
                            </option>
                            <option value="Volunteer" {% if selected_role == 'Volunteer' %}selected{% endif %}>
                                Volunteer Partner (Pickup & Delivery Fleet)
                            </option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Full Name or Organization Name</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0 text-muted">
                                <i class="bi bi-person"></i>
                            </span>
                            <input type="text" class="form-control form-control-lg border-start-0 ps-0" name="name" 
                                   placeholder="e.g. John Doe / Apex Catering" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white border-end-0 text-muted">
                                    <i class="bi bi-envelope"></i>
                                </span>
                                <input type="email" class="form-control form-control-lg border-start-0 ps-0" name="email" 
                                       placeholder="name@example.com" required>
                            </div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Mobile Number</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white border-end-0 text-muted">
                                    <i class="bi bi-telephone"></i>
                                </span>
                                <input type="tel" class="form-control form-control-lg border-start-0 ps-0" name="phone" 
                                       placeholder="e.g. 9876543210" required>
                            </div>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Create Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0 text-muted">
                                <i class="bi bi-lock"></i>
                            </span>
                            <input type="password" class="form-control form-control-lg border-start-0 ps-0" name="password" 
                                   placeholder="At least 6 characters" minlength="4" required>
                        </div>
                    </div>

                    <div class="d-grid mt-4">
                        <button class="btn btn-success btn-lg fw-bold" type="submit" id="createAccountBtn">
                            <span id="btnText">Verify Email & Continue</span>
                            <i class="bi bi-arrow-right ms-1"></i>
                        </button>
                    </div>

                </form>

                <div class="position-relative text-center my-4">
                    <hr class="text-muted opacity-25">
                    <span class="position-absolute top-50 start-50 translate-middle bg-white px-3 text-muted small" style="font-size: 0.8rem;">
                        ALREADY REGISTERED?
                    </span>
                </div>

                <p class="text-center text-muted mb-0 small">
                    Already have an account?
                    <a href="/login{% if selected_role %}?role={{ selected_role }}{% endif %}" class="fw-bold text-success text-decoration-none ms-1">
                        Sign In Here &rarr;
                    </a>
                </p>

            </div>

        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const form = document.getElementById('registerForm');
    const btn = document.getElementById('createAccountBtn');
    if (form && btn) {
        form.addEventListener('submit', function() {
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span><span>Sending Verification OTP...</span>';
            btn.classList.add('disabled');
        });
    }
});
</script>

{% endblock %}
